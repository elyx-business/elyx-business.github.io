name: demo map data
on:
  push:
    branches: [mapdata]
    paths: [jobs.json, fetch.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - run: |
          git config user.name "Elyx"; git config user.email "elyx@users.noreply.github.com"
          git add out && git commit -m "map data" && git push
